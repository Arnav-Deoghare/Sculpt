<!doctype html>
<meta charset="utf-8">
<title>Sculpt promo (portrait)</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 1080px; height: 1920px; }
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
  import { draw, DURATION } from './scene.js';
  import { encodeVideo } from './encode.js';

  const canvas = document.getElementById('c');
  const params = new URLSearchParams(location.search);

  if (params.has('t')) {
    // A single still frame, for thumbnails and for checking the animation.
    draw(canvas.getContext('2d'), parseFloat(params.get('t')));
    window.__ready = true;
  }
  window.encode = (opts) => encodeVideo({ canvas, draw, duration: DURATION, ...opts });
</script>
