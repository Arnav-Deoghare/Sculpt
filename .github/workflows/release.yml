name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Restore signing key
        env:
          SCULPT_STORE_BASE64: ${{ secrets.SCULPT_STORE_BASE64 }}
        run: |
          if [ -n "$SCULPT_STORE_BASE64" ]; then
            echo "$SCULPT_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SCULPT_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key configured; the APK will be unsigned."
          fi

      - name: Build release APK
        env:
          SCULPT_STORE_PASSWORD: ${{ secrets.SCULPT_STORE_PASSWORD }}
          SCULPT_KEY_ALIAS: ${{ secrets.SCULPT_KEY_ALIAS }}
          SCULPT_KEY_PASSWORD: ${{ secrets.SCULPT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
